description: 'Mantari is a weather-intelligence and earth-sensing company building a decision-intelligence
  platform that fuses a distributed network of sensors with AI to turn environmental data across oceans,
  skies, and space into mission-critical, actionable intelligence. It initially targets government and
  defense decision support, with plans to extend into broader economic and commercial applications. As of
  this profile Mantari publishes a marketing homepage and a careers page but no public API, developer portal,
  documentation, or SDKs; this record captures its identity plus a live domain-security probe, pending a
  future developer surface.'
